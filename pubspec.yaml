name: ai_free
version: 1.0.0+1
description: AI Free - личный ИИ помощник с голосом, фото и AgentRouter.
publish_to: 'none'
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.3
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/ai_free_preview.png
